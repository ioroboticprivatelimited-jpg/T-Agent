task_planner:
  ros__parameters:
    w_urgency: 0.5
    w_time: 0.3
    w_distance: 0.2
    battery_floor: 0.20      # fraction; below this the robot docks
    dock_pose: [0.0, 0.0, 0.0]
nav_executor:
  ros__parameters:
    # bed_id -> [x, y, yaw] in the map frame (placeholder values)
    beds: ['bed_1', 'bed_2', 'bed_3']
    bed_1: [4.0, 1.5, 1.57]
    bed_2: [8.0, 1.5, 1.57]
    bed_3: [12.0, 1.5, 1.57]
safety_supervisor:
  ros__parameters:
    min_range_m: 0.35
    scan_timeout_s: 0.5
bedside_verifier:
  ros__parameters:
    timeout_s: 60.0
t_agent:
  ros__parameters:
    w_priority: 0.4
    w_time: 0.25
    w_distance: 0.15
    w_crowd: 0.2
    th_mid: 0.25      # crowd value (0-1) where speed drops
    th_high: 0.55     # crowd value where it reroutes or holds
    hyst: 0.08
    mid_pct: 60.0
    high_pct: 40.0
    urgent: 0.7       # urgency at or above this reroutes instead of holding
crowd_monitor:
  ros__parameters:
    range_m: 3.0
    sector_deg: 120.0
